<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="description" content="Listen to published browser TTS benchmark audio examples with model, backend and receipt provenance.">
  <title>Audio examples · Browser TTS Benchmark</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <header class="audio-header">
    <nav aria-label="Project"><a href="../">← Benchmark results</a><a href="https://github.com/ngelik/tts-bench/blob/main/audio/README.md">Attribution & terms ↗</a></nav>
    <div class="heading-row"><div><h1>Audio examples</h1><p>30-second clips from published runs · listen for quality, not timing.</p></div><a class="results-link" href="../">View results ↗</a></div>
  </header>
  <main>
    <div class="filters" aria-label="Recording filters">
      <label>Model <select id="model"><option value="">All models</option></select></label>
      <label>Backend <select id="backend"><option value="">All backends</option><option value="cpu">CPU</option><option value="webgpu">GPU</option></select></label>
      <button id="show-all" type="button" aria-pressed="false">Show all published clips</button>
      <label class="diagnostic-toggle"><input id="include-diagnostic" type="checkbox"> Include waveform-flagged clips <span id="diagnostic-count"></span></label>
    </div>
    <p id="status" role="status" aria-live="polite">Loading published clips…</p>
    <section id="samples" aria-label="Audio examples">Loading clips…</section>
  </main>
  <noscript>Enable JavaScript to filter and play audio, or browse the recording receipts in the <a href="https://github.com/ngelik/tts-bench/tree/main/audio">repository</a>.</noscript>
  <script type="module" src="player.mjs"></script>
</body>
</html>
