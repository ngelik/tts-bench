name: Temporary Linnet WGSL correctness probe
on:
  push:
    branches: [codex/linnet-webgpu-probe]
    paths:
      - '.github/workflows/linnet-webgpu-probe.yml'
      - 'tools/linnet-webgpu-kernel-probe.mjs'
permissions:
  contents: read
jobs:
  software-webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compare WebGPU matmul kernels with scalar references on software adapter
        run: xvfb-run -a node tools/linnet-webgpu-kernel-probe.mjs
