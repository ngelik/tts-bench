name: Inflect Mini v3 physical WebGPU diagnostic

on:
  pull_request:
    paths:
      - '.github/scripts/inflect-mini-v3-webgpu-diagnostic.mjs'
      - '.github/workflows/inflect-mini-v3-webgpu-diagnostic.yml'
      - 'assets.lock.json'
      - 'tools/export-inflect-mini-v3.py'
      - 'tools/inflect-mini-v3-export-requirements.txt'
      - 'tools/inflect-mini-v3-conversion.lock.json'
      - 'tools/stage-inflect-mini-v3-diagnostic.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'web/adapters/inflect-mini-v3.mjs'
      - 'web/inflect-mini-v3/**'
      - 'web/inflect-micro-v3/**'
      - 'web/klein/**'
      - 'web/workers/inflect-mini-v3.mjs'
      - 'web/workers/gpu-probe.mjs'
  workflow_dispatch:
    inputs:
      full_hybrid_article:
        description: 'Run the full 93-span CPU versus duration-WebGPU hybrid diagnostic (~45 minutes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build-pinned-graphs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/inflect-mini-v3-export-requirements.txt
      - name: Install pinned graph-export dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0+cpu'
          python -m pip install --disable-pip-version-check -r tools/inflect-mini-v3-export-requirements.txt
      - name: Fetch the pinned G2P input used by native parity verification
        run: npm run assets -- fetch --model klein-tts-x1.5-pro
      - name: Export exact locked graphs on the pinned Linux CPU runtime
        env:
          INFLECT_MINI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python tools/export-inflect-mini-v3.py --download --allow-waveform-drift
      - name: Verify generated graph files against the registered asset lock
        env:
          INFLECT_MINI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          INFLECT_MINI_EXPORT_OUTCOME: success
        run: |
          node tools/stage-inflect-mini-v3-diagnostic.mjs
          npm run assets -- fetch --model inflect-mini-v3-browser-port --accept-license
          npm run assets -- verify --model inflect-mini-v3-browser-port --accept-license
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inflect-mini-v3-locked-graphs-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/inflect-mini-v3-onnx/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

  physical-webgpu-diagnostic:
    needs: build-pinned-graphs
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: inflect-mini-v3-locked-graphs-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/inflect-mini-v3-onnx
      - name: Confirm installed Chrome and Apple hardware runner
        run: |
          test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          sw_vers
          system_profiler SPDisplaysDataType
      - name: Install the pinned browser runtime
        run: npm ci --ignore-scripts
      - name: Stage and verify the exact locked graph artifact and runtime assets
        env:
          INFLECT_MINI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          INFLECT_MINI_EXPORT_OUTCOME: success
          INFLECT_MINI_CHECKPOINT_FROM_MANIFEST: '1'
        run: |
          node tools/stage-inflect-mini-v3-diagnostic.mjs
          npm run assets -- fetch --model inflect-mini-v3-browser-port --accept-license
          npm run assets -- verify --model inflect-mini-v3-browser-port --accept-license
      - name: Smoke the registered hybrid through the ordinary benchmark runner
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: node bin/bench.mjs run --model inflect-mini-v3-browser-port --backend webgpu --smoke --note 'Hosted registration smoke; duration graph WebGPU with WASM fallback, bridge and waveform WASM; not a score'
      - name: Probe real model dispatch on Apple WebGPU
        env:
          INFLECT_MINI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          INFLECT_MINI_FULL_HYBRID_ARTICLE: ${{ inputs.full_hybrid_article || 'false' }}
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: node .github/scripts/inflect-mini-v3-webgpu-diagnostic.mjs
      - name: Preserve compact WebGPU diagnostic and listening WAV
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inflect-mini-v3-webgpu-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .cache/inflect-mini-v3-webgpu-diagnostic/
            runs/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
