name: Build pinned ZONOS3 CPU/WASM runtime
on:
  # Rebuild the versioned runtime before its locked assets are published.
  push:
    branches:
      - zonos3-cpu-wasm
      - diagnostics/zonos3-cpu-fftpool-registration-20261119
    paths:
      - 'web/zonos3-cpu/**'
      - 'assets.lock.json'
      - 'tools/build-zonos3-cpu-browser.sh'
      - 'tools/build-zonos3-cpu-notices.mjs'
      - 'tools/check-zonos3-cpu-build.mjs'
      - 'tools/check-zonos3-cpu-lock.mjs'
      - '.github/workflows/zonos3-cpu-runtime-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build pinned CPU-only Emscripten runtime
        run: bash tools/build-zonos3-cpu-browser.sh .cache/public/runtimes/audio-cpp-zonos3-cpu-wasm-v3
      - name: Verify runtime files against the shared asset lock
        run: node tools/check-zonos3-cpu-lock.mjs .cache/public/runtimes/audio-cpp-zonos3-cpu-wasm-v3
      - name: Preserve runtime artifacts and exact digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zonos3-cpu-wasm-v3-runtime
          if-no-files-found: error
          include-hidden-files: true
          path: .cache/public/runtimes/audio-cpp-zonos3-cpu-wasm-v3/
