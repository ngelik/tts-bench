name: Verify public five-family player in Chrome
on:
  push:
    branches: ['verification/erogol-full-article']
    paths: ['.github/workflows/check-five-family-player.yml']
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0d5dd8e407191485dcb34565e7f42baa961f5f3f
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Play each verified sample from the public website
        run: |
          xvfb-run -a node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright-core';
          const browser = await chromium.launch({channel:'chrome',headless:false,args:['--autoplay-policy=no-user-gesture-required']});
          try {
            const page = await browser.newPage();
            const url = 'https://ngelik.github.io/tts-bench/diagnostics/erogol-small-tts/';
            assert.equal((await page.goto(url)).status(),200);
            const manifest = await (await page.request.get(url+'recordings.json')).json();
            assert.equal(manifest.recordings.length,5);
            for (const width of [1280,390]) {
              await page.setViewportSize({width,height:900});
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth <= innerWidth));
              const players = page.locator('audio');
              assert.equal(await players.count(),5);
              for (let i=0;i<5;i++) {
                const item=manifest.recordings[i];
                const result=await players.nth(i).evaluate(async (audio)=>{
                  audio.currentTime=0;
                  await audio.play();
                  await new Promise((ok,bad)=>{
                    const timer=setTimeout(()=>bad(Error('Playback clock did not advance')),5000);
                    const event=()=>{if(audio.currentTime>0.1){clearTimeout(timer); audio.removeEventListener('timeupdate',event);ok();}};
                    audio.addEventListener('timeupdate',event);
                  });
                  audio.pause();
                  const bytes=await (await fetch(audio.currentSrc)).arrayBuffer();
                  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
                  return {seconds:audio.duration,time:audio.currentTime,hash};
                });
                assert.equal(result.seconds,30);assert.equal(result.hash,item.clip.sha256);
                console.log(width,item.model,result.seconds,result.time,result.hash);
              }
            }
          } finally {await browser.close();}
          JS
