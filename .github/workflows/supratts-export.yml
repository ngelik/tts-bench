name: Export SupraTTS browser graphs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: supratts-onnx-release-v1
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned conversion tools
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --disable-pip-version-check --index-url https://pypi.org/simple 'numpy==1.26.4' 'onnx==1.17.0'
      - name: Export and validate pinned SupraTTS graphs
        run: python tools/export-supratts-onnx.py
      - name: Publish reusable MIT browser graphs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create supratts-onnx-v1 \
            .cache/supratts-onnx/duration.onnx \
            .cache/supratts-onnx/acoustic-token.onnx \
            .cache/supratts-onnx/acoustic-frame.onnx \
            .cache/supratts-onnx/decoder.onnx \
            .cache/supratts-onnx/conversion.json \
            --repo ngelik/tts-bench \
            --target "$GITHUB_SHA" \
            --title 'SupraTTS 1.0 Preview browser ONNX v1' \
            --notes 'FP32 opset-17 ONNX export from the pinned MIT SupraTTS-1.0-Preview checkpoint. The accompanying conversion.json records source and output SHA-256 values and tool versions. Export is performed on GitHub-hosted Ubuntu; speech benchmarks execute separately in headed Google Chrome.'
