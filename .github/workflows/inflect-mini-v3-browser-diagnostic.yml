name: Inflect Mini v3 browser-port diagnostic

on:
  pull_request:
    paths:
      - 'fixtures/en-20000.txt'
      - 'fixtures/en-20000.chunks.json'
      - 'web/adapters/inflect-mini-v3.mjs'
      - 'web/inflect-mini-v3/**'
      - 'web/inflect-micro-v3/**'
      - 'web/klein/**'
      - 'web/workers/inflect-mini-v3.mjs'
      - 'tools/export-inflect-mini-v3.py'
      - 'tools/inflect-mini-v3-conversion.lock.json'
      - 'tools/stage-inflect-mini-v3-diagnostic.mjs'
      - 'tools/inflect-mini-v3-browser-diagnostic.mjs'
      - 'assets.lock.json'
      - 'lib/model-parameters.json'
      - 'web/bench.mjs'
      - 'tests/assets.test.mjs'
      - 'tests/model-parameters.test.mjs'
      - 'docs/INFLECT_MINI_V3.md'
      - '.github/workflows/inflect-mini-v3-browser-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/inflect-mini-v3-export-requirements.txt
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Install pinned browser and CPU exporter dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0+cpu'
          python -m pip install --disable-pip-version-check -r tools/inflect-mini-v3-export-requirements.txt
      - name: Fetch locked local G2P and ONNX Runtime assets
        run: npm run assets -- fetch --model klein-tts-x1.5-pro
      - name: Export current pinned conversion for browser diagnostics
        id: export
        continue-on-error: true
        env:
          INFLECT_MINI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python tools/export-inflect-mini-v3.py --download --allow-waveform-drift
      - name: Stage only the generated model files for this diagnostic
        env:
          INFLECT_MINI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          INFLECT_MINI_EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: node tools/stage-inflect-mini-v3-diagnostic.mjs
      - name: Verify the registered profile through the benchmark harness
        run: |
          node bin/bench.mjs assets fetch --model inflect-mini-v3-browser-port
          node bin/bench.mjs assets verify --model inflect-mini-v3-browser-port
          # The harness requires Chromium's sandbox; use the runner-installed
          # Chrome with its system sandbox helper instead of the unpacked test binary.
          xvfb-run -a node bin/bench.mjs run --model inflect-mini-v3-browser-port --backend cpu --smoke --note 'Hosted registration smoke; not a score'
      - name: Run real hosted Chrome frontend audit and full-article CPU browser-port diagnostic
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: xvfb-run -a node tools/inflect-mini-v3-browser-diagnostic.mjs
      - name: Upload compact diagnostic evidence (no model graphs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inflect-mini-v3-browser-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/inflect-mini-v3-browser-diagnostic/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
