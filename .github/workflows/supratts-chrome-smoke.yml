name: SupraTTS hosted Chrome CPU smoke
on:
  pull_request:
    paths:
      - '.github/workflows/supratts-chrome-smoke.yml'
      - 'assets.lock.json'
      - 'tests/supratts-session-loader.test.mjs'
      - 'web/adapters/supratts.mjs'
      - 'web/bench.mjs'
      - 'web/supratts/session-loader.mjs'
      - 'web/supratts/fft.mjs'
      - 'web/workers/supratts.mjs'
  push:
    branches: [main, feat/supratts-ondevice]
    paths:
      - '.github/workflows/supratts-chrome-smoke.yml'
      - 'assets.lock.json'
      - 'tests/supratts-session-loader.test.mjs'
      - 'web/adapters/supratts.mjs'
      - 'web/bench.mjs'
      - 'web/supratts/session-loader.mjs'
      - 'web/supratts/fft.mjs'
      - 'web/workers/supratts.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supratts-hosted-chrome-cpu-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify ONNX graph sessions initialize sequentially
        run: node --test tests/supratts-session-loader.test.mjs
      - run: node bin/bench.mjs assets fetch --model supratts-1.0-preview
      - name: Run short diagnostic in headed Google Chrome
        run: >-
          xvfb-run -a node bin/bench.mjs run
          --model supratts-1.0-preview
          --backend cpu
          --smoke
          --machine 'GitHub hosted Ubuntu 24.04'
          --chrome /usr/bin/google-chrome
          --timeout-minutes 20
