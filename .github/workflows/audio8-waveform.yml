name: Verify Audio8 waveform evidence
on:
  pull_request:
    paths:
      - 'diagnostics/audio8-waveform/**'
      - '.github/workflows/audio8-waveform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-pcm-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s diagnostics/audio8-waveform
      - name: Check complete SHA-pinned recordings
        run: python3 diagnostics/audio8-waveform/reproduce.py
