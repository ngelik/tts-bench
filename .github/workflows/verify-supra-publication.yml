name: Verify public SupraTTS dashboard and audio
on:
  push:
    branches: [verification/supra-public-readback-7facf7c]
permissions:
  contents: read
jobs:
  live-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Build local expected dashboard data without inference
        run: npm run listen:build
      - name: Verify selected Supra rows and recordings in hosted Chrome
        run: xvfb-run -a node tools/verify-supra-publication.mjs
