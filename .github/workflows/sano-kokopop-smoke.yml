name: Sano heart-nano Kokopop WebGPU verification
on:
  pull_request:
    paths:
      - '.github/workflows/sano-kokopop-smoke.yml'
      - 'tools/build-sano-kokopop-webgpu.sh'
      - 'tools/build-sano-kokopop-manifest.mjs'
      - 'tools/build-sano-size-models.py'
      - 'tools/test_sano_size_builder.py'
      - 'tools/instrument-sano-frontend.py'
      - 'tools/build-sano-frontend-audit.sh'
      - 'tools/sano-frontend-audit.mjs'
      - 'docs/sano-kokopop-size-pins.json'
      - 'tools/sano-kokopop-browser-smoke.mjs'
      - 'tools/check-sano-kokopop-harness-smoke.mjs'
      - 'tools/results.mjs'
      - 'web/adapters/sano-kokopop.mjs'
      - 'web/adapters/sano-kokopop-config.mjs'
      - 'web/sano-kokopop/**'
      - 'web/workers/sano-kokopop.mjs'
      - 'assets.lock.json'
      - 'lib/assets.mjs'
      - 'lib/model-parameters.json'
      - 'web/bench.mjs'
      - 'tests/assets.test.mjs'
      - 'tests/model-parameters.test.mjs'
      - 'tests/runtime-installation.test.mjs'
      - 'tests/sano-kokopop-adapter.test.mjs'
      - 'tests/kokopop-capability-results.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sano-kokopop-smoke.yml'
      - 'tools/build-sano-kokopop-webgpu.sh'
      - 'tools/build-sano-kokopop-manifest.mjs'
      - 'tools/build-sano-size-models.py'
      - 'tools/test_sano_size_builder.py'
      - 'tools/instrument-sano-frontend.py'
      - 'tools/build-sano-frontend-audit.sh'
      - 'tools/sano-frontend-audit.mjs'
      - 'docs/sano-kokopop-size-pins.json'
      - 'tools/sano-kokopop-browser-smoke.mjs'
      - 'tools/check-sano-kokopop-harness-smoke.mjs'
      - 'tools/results.mjs'
      - 'web/adapters/sano-kokopop.mjs'
      - 'web/adapters/sano-kokopop-config.mjs'
      - 'web/sano-kokopop/**'
      - 'web/workers/sano-kokopop.mjs'
      - 'assets.lock.json'
      - 'lib/assets.mjs'
      - 'lib/model-parameters.json'
      - 'web/bench.mjs'
      - 'tests/assets.test.mjs'
      - 'tests/model-parameters.test.mjs'
      - 'tests/runtime-installation.test.mjs'
      - 'tests/sano-kokopop-adapter.test.mjs'
      - 'tests/kokopop-capability-results.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tterrasson/kokopop
          ref: 73ed5710cb37ca0384bc4bfdd7138d13605c9a88
          path: .cache/sano-kokopop-build/upstream
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Ampixa/sanoTTS
          ref: 939d982b9faa54cbcf5d24cc878f5cd514b2646e
          path: .cache/ampixa-sanoTTS
          sparse-checkout: mcu/test/fixtures/en_us_e13b
          sparse-checkout-cone-mode: true
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Test interrupted and corrupt model-cache recovery
        run: python tools/test_sano_size_builder.py
      - name: Build Kokopop WebGPU runtime and convert exact heartnano Q8 sources
        env:
          KOKOPOP_SOURCE: ${{ github.workspace }}/.cache/sano-kokopop-build/upstream
          BUILD_JOBS: '4'
        run: bash tools/build-sano-kokopop-webgpu.sh
      - name: Build a separate observation-only frontend diagnostic
        run: bash tools/build-sano-frontend-audit.sh
      - name: Check converted F32 GGUF against the official heartnano golden fixture
        env:
          KOKOPOP_SOURCE: ${{ github.workspace }}/.cache/sano-kokopop-build/upstream
          KOKOPOP_SANOTTS_FIXTURES: ${{ github.workspace }}/.cache/ampixa-sanoTTS/mcu/test/fixtures
        run: |
          source_dir="$KOKOPOP_SOURCE"
          test "$(git -C "$source_dir" rev-parse HEAD)" = 73ed5710cb37ca0384bc4bfdd7138d13605c9a88
          mkdir -p "$source_dir/models"
          cp .cache/sano-kokopop-build/release/heartnano-f32.gguf "$source_dir/models/sanotts-heartnano.gguf"
          # Kokopop's unrelated Kokoro helper uses std::sinf, which GCC 13
          # rejects in strict C++17 mode. The browser artifact was built above
          # from the unchanged pinned source; adapt only this host-only golden
          # test build, and require the exact expected occurrence count.
          python3 - "$source_dir/src/arch/kokoro/graph_ops.cpp" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          if source.count('std::sinf(') != 7:
              raise SystemExit('Expected exactly seven upstream std::sinf calls in the pinned host-test source')
          path.write_text(source.replace('std::sinf(', 'std::sin('))
          PY
          cmake -G Ninja -S "$source_dir" -B .cache/sano-kokopop-build/native-test \
            -DCMAKE_BUILD_TYPE=Release -DKOKOPOP_BUILD_TESTS=ON \
            -DKOKOPOP_BUILD_TOOLS=OFF -DKOKOPOP_BUILD_WEB=OFF \
            -DKOKOPOP_ENABLE_WEBGPU=OFF -DKOKOPOP_ENABLE_OPUS=OFF
          cmake --build .cache/sano-kokopop-build/native-test --target kokopop_tests --parallel 4
          (cd "$source_dir" && "$GITHUB_WORKSPACE/.cache/sano-kokopop-build/native-test/kokopop_tests" \
            --test-case=sanotts_vocos_decoder_matches_the_heartnano_golden_fixture)
      - run: node --test tests/sano-kokopop-adapter.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sano-kokopop-runtime-and-model-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: .cache/sano-kokopop-build/release/
          retention-days: 14

  browser-smoke:
    needs: build-and-golden
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sano-kokopop-runtime-and-model-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/sano-kokopop-build/release
      - run: npm ci --ignore-scripts
      - name: Import and verify the locked generated asset closure
        run: |
          for model in sano-heart-nano-gguf-f32 sano-heart-gguf sano-amy-gguf sano-amy-small-gguf sano-amy-1p8m-gguf sano-hfc-gguf sano-kristin-gguf; do
            node bin/bench.mjs assets import --model "$model" --source .cache/sano-kokopop-build/release --accept-license
            node bin/bench.mjs assets verify --model "$model" --accept-license
          done
      - name: Audit the full canonical fixture through the actual browser frontend
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: node tools/sano-frontend-audit.mjs
      - name: Run headed Chrome CPU and hardware WebGPU parity smoke
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          for model in sano-heart-nano-gguf-f32 sano-heart-gguf sano-amy-gguf sano-amy-small-gguf sano-amy-1p8m-gguf sano-hfc-gguf sano-kristin-gguf; do
            node tools/sano-kokopop-browser-smoke.mjs "$model"
          done
      - name: Validate normal benchmark harness WebGPU smoke receipt
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          for model in sano-heart-nano-gguf-f32 sano-heart-gguf sano-amy-gguf sano-amy-small-gguf sano-amy-1p8m-gguf sano-hfc-gguf sano-kristin-gguf; do
          node bin/bench.mjs run --model "$model" --backend webgpu --scenario offline --smoke --machine "GitHub-hosted macOS-15" --chrome "$CHROME_PATH" --accept-license --note "Receipt-schema and adapter proof smoke; not a benchmark score." > ".cache/sano-kokopop-browser-evidence/harness-smoke-$model.json"
          node tools/check-sano-kokopop-harness-smoke.mjs ".cache/sano-kokopop-browser-evidence/harness-smoke-$model.json" "$model"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sano-kokopop-browser-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: .cache/sano-kokopop-browser-evidence/
          if-no-files-found: warn
          retention-days: 14
