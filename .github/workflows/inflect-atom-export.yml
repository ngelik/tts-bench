name: Inflect Atom v3 browser export
on:
  push:
    branches: [feat/inflect-atom-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
      - run: python -m pip install numpy==2.4.2 onnx==1.19.1 onnxruntime==1.24.2 misaki==0.9.4 phonemizer-fork==3.3.2 espeakng-loader==0.2.4
      - run: python tools/inflect-atom/export.py --output generated/inflect-atom
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
      - run: |
          g++ -std=c++17 -O3 -ffp-contract=off -shared -fPIC tools/inflect-atom/dsp.cpp -o /tmp/atom-dsp.so
          python tools/inflect-atom/check-dsp.py generated/inflect-atom /tmp/atom-dsp.so
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021
        with:
          version: '3.1.74'
      - run: bash tools/inflect-atom/build-wasm.sh generated/inflect-atom
      - run: node tools/inflect-atom/check-frontend.mjs generated/inflect-atom
      - run: node tools/inflect-atom/check-wasm-dsp.mjs generated/inflect-atom
      - run: node --test tests/inflect-atom.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inflect-atom-export-${{ github.sha }}
          path: generated/inflect-atom/
          if-no-files-found: error
          retention-days: 14
