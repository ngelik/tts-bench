name: Validate benchmark submissions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run fixtures -- check
      - run: npm test
      - name: Test local failed-waveform evidence in Chrome
        run: xvfb-run -a node --test tests/browser-failed-waveform.mjs
      - run: npm run validate
      - run: node tools/compare.mjs --check comparisons
      - run: node tools/campaign-report.mjs --check-all reports
      - run: npm run reference -- --check
      - run: npm run audio -- check
      - run: npm run listen:build
      - name: Verify dashboard language and recording controls in Chrome
        env:
          TTS_BENCH_UI_CHROME: /usr/bin/google-chrome
        run: xvfb-run -a node --test tests/dashboard-language.test.mjs
      - name: Verify eligible dashboard results in Chrome
        run: xvfb-run -a node tools/check-dashboard.mjs
      - name: Verify clean and mixed-cache Pages visits in Chrome
        run: xvfb-run -a node tools/check-site-cache.mjs
      - run: node tools/publication-check.mjs
