name: Export pinned Inflect Micro v3 browser graphs
on:
  push:
    branches: [feat/inflect-micro-v3]
    paths:
      - 'tools/inflect-micro-v3/**'
      - '.github/workflows/inflect-micro-v3-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/inflect-micro-v3/requirements-export.txt
      - name: Install pinned CPU export dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          python -m pip install -r tools/inflect-micro-v3/requirements-export.txt
      - name: Fetch exact public checkpoint snapshot
        id: source
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import ast
          from pathlib import Path
          from huggingface_hub import snapshot_download
          tree = ast.parse(Path("tools/inflect-micro-v3/export.py").read_text())
          source_revision = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "SOURCE_REVISION" for target in node.targets)
          )
          path = snapshot_download(
              repo_id="owensong/Inflect-Micro-v3",
              revision=source_revision,
              local_dir=".cache/inflect-micro-v3-source",
          )
          print(f"path={path}")
          PY
      - name: Export and validate graph parity
        run: |
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 \
            python tools/inflect-micro-v3/export.py \
              --source "${{ steps.source.outputs.path }}" \
              --output generated/inflect-micro-v3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inflect-micro-v3-export-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: generated/inflect-micro-v3/
          retention-days: 14
