name: Export Inflect Mini v3 browser graphs

on:
  pull_request:
    paths:
      - 'tools/export-inflect-mini-v3.py'
      - 'tools/inflect-mini-v3-conversion.lock.json'
      - 'tools/inflect-mini-v3-export-requirements.txt'
      - 'tools/check-inflect-mini-v3-export.mjs'
      - 'web/inflect-mini-v3/source-dsp.mjs'
      - 'web/inflect-mini-v3/source-dsp-cli.mjs'
      - 'web/workers/inflect-mini-v3.mjs'
      - 'tests/inflect-mini-v3-source-dsp.test.mjs'
      - '.github/workflows/inflect-mini-v3-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/inflect-mini-v3-export-requirements.txt
      - name: Install pinned CPU exporter
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0+cpu'
          python -m pip install --disable-pip-version-check -r tools/inflect-mini-v3-export-requirements.txt
      - name: Export pinned Mini v3 and compare ONNX against native inference
        env:
          INFLECT_MINI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python tools/export-inflect-mini-v3.py --download --allow-waveform-drift
      - name: Verify locked browser-port graphs and complete native parity diagnostics
        env:
          INFLECT_MINI_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/check-inflect-mini-v3-export.mjs
      - name: Upload compact strict-parity diagnostics (no generated graphs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inflect-mini-v3-native-parity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .cache/inflect-mini-v3-onnx/BUILD-MANIFEST.json
            .cache/inflect-mini-v3-onnx/PARITY-DIAGNOSTIC.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
