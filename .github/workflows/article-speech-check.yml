name: Check speech at both ends of completed browser articles
on:
  push:
    branches: ['verification/erogol-full-article']
    paths: ['.github/workflows/article-speech-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install the fixed offline English recognizer
        run: python3 -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
      - name: Read the original Chrome artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44107462780 -R ngelik/tts-bench --name hosted-article-supratts-1.0-preview --dir evidence/supratts-1.0-preview
          gh run download 44107462780 -R ngelik/tts-bench --name hosted-article-sopro-v2-turbo --dir evidence/sopro-v2-turbo
          gh run download 44108678629 -R ngelik/tts-bench --name hosted-article-klein-tts-x1.5-pro --dir evidence/klein-tts-x1.5-pro
          gh run download 44110232347 -R ngelik/tts-bench --name hosted-article-linnet-en-35m --dir evidence/linnet-en-35m
      - name: Transcribe the first and last fifteen seconds
        run: |
          python3 - <<'PY'
          import hashlib, json, wave
          from pathlib import Path
          import torch, torchaudio

          torch.set_num_threads(2)
          bundle = torchaudio.pipelines.WAV2VEC2_ASR_BASE_960H
          recognizer = bundle.get_model().eval()
          labels = bundle.get_labels()
          observations = []
          for folder in sorted(Path('evidence').iterdir()):
              path = folder / 'full.wav'
              receipt = json.loads((folder / 'result.json').read_bytes())
              trial, = receipt['cells'][0]['trials']
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert digest == trial['audio']['sha256']
              row = {'model': folder.name, 'recording': digest, 'recognizer': 'wav2vec2-asr-base-960h (torchaudio 2.6.0)'}
              with wave.open(str(path)) as wav:
                  assert wav.getnchannels() == 1 and wav.getsampwidth() == 2
                  length, rate = wav.getnframes(), wav.getframerate()
                  frames = 15 * rate
                  for name, offset in [('first15s', 0), ('last15s', length - frames)]:
                      wav.setpos(offset)
                      audio = torch.frombuffer(bytearray(wav.readframes(frames)), dtype=torch.int16).float()[None, :] / 32768
                      audio = torchaudio.functional.resample(audio, rate, bundle.sample_rate)
                      with torch.inference_mode():
                          emissions, _ = recognizer(audio)
                      tokens = emissions[0].argmax(dim=-1).unique_consecutive().tolist()
                      row[name] = ''.join(labels[token] for token in tokens if token).replace('|', ' ').strip()
              print(json.dumps(row))
              observations.append(row)
          Path('observations.json').write_text(json.dumps(observations, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: article-speech-observations
          path: observations.json
          retention-days: 14
