name: Verify public five-family Linnet dashboard
on:
  push:
    branches: [verification/five-family-live-mobile-scroll-018193c]
permissions:
  contents: read
jobs:
  public-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_DEPLOY_SHA: 018193cfea7a15507585d70af5bcb1416e749aa3
      PAGES_DEPLOYMENT_RUN_URL: https://github.com/ngelik/tts-bench/actions/runs/44335621805
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Confirm the exact deployed source parent
        run: |
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$EXPECTED_DEPLOY_SHA"
          echo "DEPLOYED_SOURCE_COMMIT=$actual" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Build exact-source expected dashboard data
        run: npm run listen:build
      - name: Verify the live dashboard and its actual same-site baseline in Chrome
        run: xvfb-run -a node tools/check-dashboard.mjs --url https://ngelik.github.io/tts-bench/ --baseline-url https://ngelik.github.io/tts-bench/
      - name: Verify five-family tables, charts, mobile layout and inline audio
        run: xvfb-run -a node tools/verify-five-family-live.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: five-family-public-chrome-mobile-scroll-018193c
          path: |
            .cache/dashboard-review/
            .cache/five-family-review/
          if-no-files-found: warn
          retention-days: 14
