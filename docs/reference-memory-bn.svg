<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="492" viewBox="0 0 1080 492" role="img" aria-labelledby="title desc"><title id="title">Average Chrome RAM during speech generation — Bangla</title><desc id="desc">Separate full-article diagnostics. Owned Chrome process-tree RSS includes browser baseline and workers. Decimal megabytes; lower uses less memory. Unsupported backends have no bar.</desc><rect width="100%" height="100%" fill="#f7f9fc"/><g font-family="system-ui,sans-serif" fill="#192b47"><text x="32" y="42" font-size="25" font-weight="700">Chrome RAM · Bangla full article diagnostics</text><text x="32" y="68" font-size="13">One isolated Chrome instance · includes workers and browser baseline · excludes loading and audio export</text><text x="32" y="100" font-size="14" font-weight="700">RAM 1 · bn-article-v1 · MacBook Pro (Apple M1 Pro, 16 GB) · n=1 article(s)</text><text x="32" y="122" font-size="11">Google Chrome 157.0.8103.79 · browser-tts-cached-v1-resources · source 0919d332</text><text x="32" y="168" font-size="14" font-weight="600">Hansda Bengali Voice Compact INT8 (Jahnavi)</text><text x="330" y="171" font-size="11">CPU</text><rect x="400" y="158" width="452.17" height="19" rx="5" fill="#276bdb"/><text x="862.17" y="172" font-size="12">1323.76 MB</text><text x="330" y="198" font-size="11">WebGPU</text><text x="400" y="198" font-size="12" fill="#6c7686">—</text><text x="32" y="296" font-size="14" font-weight="700">RAM 2 · bn-article-v1 · MacBook Pro (Apple M1 Pro, 16 GB) · n=1 article(s)</text><text x="32" y="318" font-size="11">Google Chrome 157.0.8103.79 · browser-tts-cached-v1-resources · source 680bbce8</text><text x="32" y="364" font-size="14" font-weight="600">Tiny Swara Bengali BF (INT8)</text><text x="330" y="367" font-size="11">CPU</text><rect x="400" y="354" width="452.17" height="19" rx="5" fill="#276bdb"/><text x="862.17" y="368" font-size="12">1313.78 MB</text><text x="330" y="394" font-size="11">WebGPU</text><rect x="400" y="381" width="430.08" height="19" rx="5" fill="#9b4fc4"/><text x="840.08" y="395" font-size="12">1249.60 MB</text><text x="32" y="468" font-size="12" fill="#6c7686">Sample means, not model-only RAM or GPU VRAM. RSS may double-count shared pages. Timing scores are reported separately.</text></g></svg>
