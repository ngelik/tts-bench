xt><text x="330" y="394" font-size="11">WebGPU</text><rect x="400" y="381" width="439.94" height="19" rx="5" fill="#9b4fc4"/><text x="849.94" y="395" font-size="12">1067.00 MB</text><text x="32" y="492" font-size="14" font-weight="700">RAM 3 · tr-article-v1 · MacBook Pro (Apple M1 Pro, 16 GB) · n=1 article(s)</text><text x="32" y="514" font-size="11">Google Chrome 157.0.8103.79 · browser-tts-cached-v1-resources · source c5ef9de0</text><text x="32" y="560" font-size="14" font-weight="600">Supertonic 3 FP32 (M3)</text><text x="330" y="563" font-size="11">CPU</text><text x="400" y="563" font-size="12" fill="#6c7686">—</text><text x="330" y="590" font-size="11">WebGPU</text><rect x="400" y="577" width="452.17" height="19" rx="5" fill="#9b4fc4"/><text x="862.17" y="591" font-size="12">2362.78 MB</text><text x="32" y="664" font-size="12" fill="#6c7686">Sample means, not model-only RAM or GPU VRAM. RSS may double-count shared pages. Timing scores are reported separately.</text></g></svg>
