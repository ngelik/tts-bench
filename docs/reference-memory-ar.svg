" y="394" font-size="11">WebGPU</text><rect x="400" y="381" width="400.63" height="19" rx="5" fill="#9b4fc4"/><text x="810.63" y="395" font-size="12">1802.94 MB</text><text x="32" y="468" font-size="12" fill="#6c7686">Sample means, not model-only RAM or GPU VRAM. RSS may double-count shared pages. Timing scores are reported separately.</text></g></svg>
