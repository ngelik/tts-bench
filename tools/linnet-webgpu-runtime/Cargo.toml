[package]
name = "linnet-webgpu-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
linnet-tts = { path = "../upstream/runtime/linnet-tts", features = ["webgpu-probe"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
